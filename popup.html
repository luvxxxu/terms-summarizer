<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>약관 요약</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">📜 약관 요약</div>
    <button id="openOptions" class="icon-btn" title="설정">⚙️</button>
  </header>

  <section class="controls">
    <label class="provider">
      <span>제공자</span>
      <select id="provider"></select>
    </label>
    <div class="model" id="modelInfo"></div>
    <div class="buttons">
      <button id="summarizePage" class="primary">이 페이지 약관 요약</button>
      <button id="summarizeSelection" title="페이지에서 드래그한 부분만 요약">선택 영역만</button>
    </div>
  </section>

  <main id="output">
    <div id="empty" class="empty">
      약관·개인정보처리방침 페이지에서 <b>이 페이지 약관 요약</b>을 누르세요.<br>
      일부만 요약하려면 텍스트를 드래그한 뒤 <b>선택 영역만</b>을 누르거나 우클릭 메뉴를 사용하세요.
    </div>
    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <div id="step"></div>
      <button id="cancel" class="link">취소</button>
    </div>
    <div id="error" class="error" hidden></div>
    <div id="result" hidden>
      <div id="warnings"></div>
      <article id="summary" class="summary"></article>
      <footer class="meta">
        <span id="meta"></span>
        <span class="actions">
          <button id="copy" class="link">복사</button>
          <button id="retry" class="link">다시 요약</button>
        </span>
      </footer>
      <p class="disclaimer">AI 요약은 부정확할 수 있으며 법률 자문이 아닙니다. 중요한 결정 전에는 원문을 확인하세요.</p>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
